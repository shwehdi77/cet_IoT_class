<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Temperature & Humidity</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #101820;
        color: #e6edf3;
        padding: 24px;
      }
      .reading {
        font-size: 1.2rem;
        margin-bottom: 12px;
      }
      .label-text {
        color: #8fe3ff;
      }
      .unit {
        color: #9fb6c4;
      }
      /* زر العودة */
      .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        color: #08131b;
        background: #ffb300;
        border-radius: 8px;
        transition:
          transform 0.1s ease,
          background 0.2s ease;
      }
      .back-btn:hover {
        background: #ffa000;
      }
      .back-btn:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="reading">
      <span class="label-text">Temp = </span>
      <span id="temp">Loading...</span>
      <span class="unit">°C</span>
    </div>
    <div class="reading">
      <span class="label-text">Humi = </span>
      <span id="humi">Loading...</span>
      <span class="unit"> %</span>
    </div>

    <!-- زر العودة إلى الصفحة الرئيسية -->
    <a href="index.html" class="back-btn">← العودة للرئيسية</a>

    <script>
      // تعريف دالة غير متزامنة (async) لجلب القراءات من اللوحة دون تجميد الواجهة
      async function loadTemp() {
        try {
          // إرسال طلب HTTP GET إلى IP لوحة Wemos وانتظار استلام الرد
          const response = await fetch("http://192.168.1.68");
          // تحويل نص الرد المستلم إلى كائن برمجي بتنسيق JSON
          const data = await response.json();
          // تحديث محتوى عنصر الحرارة في الصفحة بالقيمة القادمة من الحساس (data.temp)
          document.getElementById("temp").textContent = data.temp;
          // تحديث محتوى عنصر الرطوبة في الصفحة بالقيمة القادمة من الحساس (data.hum)
          document.getElementById("humi").textContent = data.hum;
          // طباعة البيانات المستلمة في Console المتصفح لأغراض المراقبة والتصحيح
          console.log("Data updated: ", data);
        } catch (error) {
          console.error("فشل الاتصال باللوحة: ", error);
        }
      }
      // استدعاء الدالة لمرة واحدة فور فتح الصفحة لعرض البيانات مباشرة
      loadTemp();
      // ضبط مؤقت زمني لتكرار تنفيذ الدالة تلقائياً كل 1000 ملي ثانية (ثانية واحدة)
      setInterval(loadTemp, 1000);
    </script>
  </body>
</html>
